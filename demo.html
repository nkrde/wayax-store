<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WayaX Demo Flows</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#171829;--mut:#5f6680;--line:#c9cdd6;--pur:#8e63f1;--tea:#19b7ac;--amb:#f2b866;--bg:#f6f7ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 13px Inter,sans-serif;display:grid;grid-template-columns:1fr 440px;height:100vh;overflow:hidden}
/* left: flow map */
.left{display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden;border-right:1px solid #e3e6ef}
.top{flex:none;display:flex;align-items:center;gap:12px;padding:12px 18px;background:#fff;border-bottom:1px solid #e3e6ef;flex-wrap:wrap}
.top h1{font:700 17px Sora,sans-serif;white-space:nowrap}.top h1 span{color:var(--pur)}
.now{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.now b{font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font:600 11.5px Inter;white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis}
.chip.scr{background:var(--pur);color:#fff}
.chip.toast{background:#1c1c1e;color:#fff}.chip.blt{background:#fff1dc;color:#7a4a12;border:1px solid var(--amb)}.chip.bdk{background:#1c1c1e;color:#fff}
.chip.sheet{background:#efe8ff;color:#5b3bb5}.chip.push{background:#3a2f6b;color:#fff}.chip.popup{background:#e3e6ef;color:var(--ink)}
.chip.plan{background:#eaf8f6;color:#08645d}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.wrap{flex:1;overflow:auto;position:relative}
#canvas{position:relative;width:1660px;height:1080px;transform-origin:0 0}
#edges{position:absolute;inset:0;pointer-events:none;z-index:1}.n{z-index:2}
#edges path{fill:none;stroke:#b8bdcc;stroke-width:1.6;opacity:.75}#edges path.x{stroke-dasharray:4 5;opacity:0}#edges path.near{opacity:1;stroke:#9a84e8;stroke-width:2.2}#edges path.x.near{opacity:.9}
#edges path.hot{stroke:var(--pur);stroke-width:3}
.band{position:absolute;left:8px;width:1640px;border-radius:20px;border:1px solid #e6e8f0}.band.onb{background:#ffffff}.band.ai{background:#f6f2ff}.band.rs{background:#effaf8}.band.mn{background:#fff8ee}
.band b{position:absolute;left:16px;top:-13px;padding:3px 12px;border-radius:99px;background:#171829;color:#fff;font:700 12px Sora,sans-serif;letter-spacing:.3px}.band i{position:absolute;right:16px;top:-11px;font:600 11px Inter;font-style:normal;color:var(--mut);background:#fff;border:1px solid #e3e6ef;border-radius:99px;padding:2px 10px}
.n{position:absolute;width:132px;min-height:46px;padding:7px 10px;border-radius:12px;background:#fff;border:2px solid #2b2d47;display:flex;flex-direction:column;justify-content:center;gap:1px;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s}
.n:hover{transform:translateY(-2px)}
.n b{font:600 12.5px/1.2 Inter}.n small{font:400 10.5px/1.25 Inter;color:var(--mut)}
.n.ov{border-width:1.5px;border-style:solid;border-radius:99px;min-height:38px;padding:5px 12px}
.n.ov small{display:none}
.n.k-toast{background:#1c1c1e;border-color:#1c1c1e;color:#fff}
.n.k-blt{background:#fff1dc;border-color:var(--amb);color:#7a4a12}
.n.k-bdk{background:#2a2b33;border-color:#2a2b33;color:#fff}
.n.k-sheet{background:#efe8ff;border-color:#b9a2f7;color:#3b2a7a}
.n.k-push{background:#3a2f6b;border-color:#3a2f6b;color:#fff}
.n.k-popup{background:#eef0f6;border-color:#9aa0b4}
.n .tg{position:absolute;top:-9px;right:8px;font:700 9px Inter;letter-spacing:.5px;padding:2px 6px;border-radius:99px;background:#fff;color:var(--ink);border:1px solid #d9ddec}
.n.seen{box-shadow:0 0 0 3px #e5dcf3}
.n.on{animation:pulse 1.6s ease-in-out infinite;background:var(--pur);border-color:var(--pur);color:#fff;box-shadow:0 0 0 6px rgba(142,99,241,.25),0 10px 24px rgba(142,99,241,.35);transform:scale(1.06)}
.n.on small{color:#efe8ff}
.n.lit{box-shadow:0 0 0 5px rgba(242,184,102,.55),0 0 26px rgba(242,184,102,.8);transform:scale(1.06)}
.n.dec{border-style:dashed}
@keyframes pulse{0%,100%{box-shadow:0 0 0 6px rgba(142,99,241,.25),0 10px 24px rgba(142,99,241,.35)}50%{box-shadow:0 0 0 12px rgba(142,99,241,.08),0 10px 24px rgba(142,99,241,.35)}}
.trail{display:flex;align-items:center;gap:4px;padding:8px 18px;background:#fbfbfe;border-bottom:1px solid #eef0f4;font:500 11.5px Inter;color:var(--mut);overflow:hidden;white-space:nowrap;flex:none}.trail span{padding:3px 9px;border-radius:99px;background:#eef0f6;color:var(--ink)}.trail span:last-child{background:var(--pur);color:#fff}.trail em{font-style:normal;opacity:.5}
.wrap{overflow-x:hidden}
/* right: phone */
.right{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;background:#ecedf4;height:100vh;overflow:hidden}
.phone{width:410px;height:864px;border-radius:52px;background:#111;padding:10px;box-shadow:0 20px 50px rgba(17,19,29,.3);flex:none;transform-origin:top center}
.phone iframe{width:390px;height:844px;border:0;border-radius:42px;background:#fff;display:block}
.ctl{width:410px;display:flex;flex-direction:column;gap:8px}
.ctl .row{display:flex;gap:6px;flex-wrap:wrap}
.ctl button,.ctl select{height:32px;padding:0 12px;border-radius:10px;border:1px solid #d9ddec;background:#fff;font:600 12px Inter;color:var(--ink);cursor:pointer}
.ctl button.pri{background:#1c1c1e;color:#fff;border-color:#1c1c1e}
.ctl p{font:400 11.5px/1.4 Inter;color:var(--mut)}
</style>
</head>
<body>
<section class="left">
  <div class="top">
    <h1>WayaX <span>demo flows</span></h1>
    <div class="now" id="now"></div>
    <div class="legend"><span class="chip toast">Toast</span><span class="chip blt">Banner</span><span class="chip sheet">Sheet</span><span class="chip popup">Popup</span><span class="chip push">Push</span></div>
  </div>
  <div class="trail" id="trail"><b style="color:var(--ink)">Path</b><em>·</em>start using the phone</div>
  <div class="wrap" id="wrap"><div id="canvas"><svg id="edges"></svg></div></div>
</section>
<aside class="right">
  <div class="phone" id="phone"><iframe id="app" src="preview.html" title="WayaX mobile app"></iframe></div>
  <div class="ctl">
    <div class="row">
      <button class="pri" id="bPick">Restart · pick user</button>
      <select id="bPlan"><option value="">Jump to plan state…</option></select>
    </div>
    <div class="row"><button id="bNext">Next day (free)</button><button id="bPush">Monday push</button><button id="bFit">Fit map</button></div>
    <p>Use the phone as normal. The map on the left lights up the screen you are on, plus any toast, banner, sheet or push showing right now. Tap a screen on the map to jump there.</p>
  </div>
</aside>
<script>
const G={onb:[40,3],ai:[302,4],rs:[672,3],mn:[952,2]};
const X=c=>24+c*150, Y=(b,r)=>G[b][0]+20+r*72;
// id, band, col, row, title, sub, kind
const N=[
 ['cine','onb',0,0,'Intro','cinematic'],['start','onb',1,0,'Welcome','sign up · log in · guest'],['pick','onb',1,1,'Demo picker','demo only','dec'],
 ['n2name','onb',2,0,'Name'],['n2mobile','onb',3,0,'Mobile','required'],['n2otp','onb',4,0,'OTP'],['n3gmail','onb',5,0,'Link Gmail','optional'],['n2age','onb',6,0,'Age'],['n2city','onb',7,0,'City'],
 ['li','onb',2,1,'Log in','saved · Google · OTP'],['s2mobile','onb',3,1,'Mobile','phone OTP'],['s2otp','onb',4,1,'OTP'],
 ['g-home','onb',2,2,'Guest home','1 free question'],['g-ask','onb',3,2,'Sign up to keep asking','2nd question','sheet'],['g-calls','onb',4,2,'Live calls','sign up','sheet'],['g-chats','onb',5,2,'History','sign up','sheet'],['g-watch','onb',6,2,'Watch To Buy','sign up','sheet'],['g-port','onb',7,2,'Portfolio','sign up','sheet'],['g-menu','onb',8,2,'Guest menu','sign up · log in'],
 ['ov-welcome','onb',8,0,'Welcome · 3 free a day','','toast'],['ov-upgraded','onb',5,1,'AI now included','','sheet'],
 ['ai','ai',0,0,'WayaX AI','home'],['chat','ai',1,0,'Answer','ring moves'],
 ['ov-1left','ai',2,0,'1 free question left','','blt'],['ov-limit','ai',3,0,'Today’s 3 used','','bdk'],['sh-daily','ai',4,0,'Get unlimited','','sheet'],['ov-nextday','ai',5,0,'3 free today','','toast'],['ov-ended','ai',6,0,'Free questions over','','bdk'],
 ['ov-week','ai',2,1,'Weekly limit reached','','bdk'],['sh-topup','ai',3,1,'Top-ups','','sheet'],['ov-topadd','ai',4,1,'Top-up added','','toast'],['push','ai',5,1,'Monday reset','','push'],
 ['skills','ai',1,2,'Skills','pick a skill'],['sp','ai',2,2,'Saved prompts','bookmarks'],['wsm','ai',3,2,'Waya Score','','popup'],['chats','ai',4,2,'Chats','history'],['sh-chat','ai',5,2,'Chat menu','pin · rename · delete','sheet'],['ov-chat','ai',6,2,'Chat updated','','toast'],
 ['watch','ai',1,3,'Watch To Buy','entry zones'],['port','ai',2,3,'My Portfolio','holdings'],['sh-hold','ai',3,3,'New holding','','sheet'],
 ['research','rs',0,0,'In House','research'],['locked','rs',1,0,'Locked calls','not subscribed'],['xpl','rs',2,0,'Explore plans'],['sh-buy','rs',3,0,'Subscribe','Quarterly · Yearly','sheet'],['ov-believer','rs',4,0,'You’re a Waya Believer','','toast'],['plan','rs',5,0,'Active plan'],['aiu','rs',6,0,'AI usage','% + history'],
 ['dash','rs',1,1,'Dashboard','open calls'],['exited','rs',2,1,'Exited calls'],['swing','rs',3,1,'Swing trades'],['baskets','rs',4,1,'Baskets'],['bdet','rs',5,1,'Basket detail'],['pms','rs',6,1,'PMS'],
 ['notifs','rs',1,2,'Notifications'],['g-rs','rs',2,2,'Guest research','full Pro view'],['g-rtaps','rs',3,2,'First 4 taps','all tabs open'],['g-rdash','rs',4,2,'Dashboard','stays clear'],['g-rgate','rs',5,2,'Half blur','sign-up card','sheet'],['g-rsign','rs',6,2,'Sign up free','or log in'],['ov-lapsed','rs',7,0,'Plan ended','','toast'],
 ['panel','mn',0,0,'Side menu','swipe or ☰'],['profile','mn',1,0,'Profile'],['ov-saved','mn',2,0,'Profile saved','','toast'],['apps','mn',3,0,'Waya Apps'],['about','mn',4,0,'About'],['faqs','mn',5,0,'FAQs'],['privacy','mn',6,0,'Privacy'],['terms','mn',7,0,'Terms'],['ov-logout','mn',8,0,'Logged out','','toast'],
 ['ov-other','mn',1,1,'Other toast','','toast'],['ov-sheet','mn',2,1,'Other sheet','','sheet']
];
const E=[['cine','start'],['start','pick'],['start','li'],['pick','n2name'],['n2name','n2mobile'],['n2mobile','n2otp'],['n2otp','n3gmail'],['n3gmail','n2age'],['n2age','n2city'],['n2city','ov-welcome'],['pick','li'],['pick','g-home'],['g-home','g-ask'],['g-ask','g-calls'],['g-calls','g-chats'],['g-chats','g-watch'],['g-watch','g-port'],['g-port','g-menu'],['g-rs','g-rtaps'],['g-rtaps','g-rdash'],['g-rdash','g-rgate'],['g-rgate','g-rsign'],['g-ask','n2name'],['g-menu','li'],['li','s2mobile'],['s2mobile','s2otp'],['s2otp','ov-upgraded'],
 ['ov-welcome','ai'],['ov-upgraded','ai'],['ai','chat'],['chat','ov-1left'],['ov-1left','ov-limit'],['ov-limit','sh-daily'],['sh-daily','ov-nextday'],['ov-nextday','ov-ended'],
 ['chat','ov-week'],['ov-week','sh-topup'],['sh-topup','ov-topadd'],['ov-topadd','push'],
 ['ai','skills'],['skills','sp'],['ai','wsm'],['ai','chats'],['chats','sh-chat'],['sh-chat','ov-chat'],['ai','watch'],['ai','port'],['port','sh-hold'],
 ['ai','research'],['research','locked'],['locked','xpl'],['sh-daily','xpl'],['ov-ended','xpl'],['xpl','sh-buy'],['sh-buy','ov-believer'],['ov-believer','plan'],['plan','aiu'],['ov-lapsed','xpl'],
 ['research','dash'],['dash','exited'],['exited','swing'],['swing','baskets'],['baskets','bdet'],['bdet','pms'],['research','notifs'],
 ['ai','panel'],['panel','profile'],['profile','ov-saved'],['ov-saved','apps'],['apps','about'],['about','faqs'],['faqs','privacy'],['privacy','terms'],['terms','ov-logout'],['panel','plan'],['panel','aiu']];
const TAGS={toast:'TOAST',blt:'BANNER',bdk:'BANNER',sheet:'SHEET',push:'PUSH',popup:'POPUP'};
const canvas=document.getElementById('canvas'),svg=document.getElementById('edges');
const BAND={onb:'1 · Getting in',ai:'2 · WayaX AI',rs:'3 · In House and plans',mn:'4 · Side menu and account'};const HINT={onb:'Row 1 sign-up · Row 2 log in · Row 3 guest',ai:'Row 1 free user · Row 2 Pro user · Rows 3–4 skills, chats, watch, portfolio',rs:'Row 1 subscribe path · Row 2 research · Row 3 alerts and guest',mn:'Everything in the ☰ menu'};
for(const b in G){const d=document.createElement('div');d.className='band '+b;d.style.top=(G[b][0]-6)+'px';d.style.height=(G[b][1]*72+30)+'px';d.innerHTML='<b>'+BAND[b]+'</b><i>'+HINT[b]+'</i>';canvas.appendChild(d);}
const EL={},POS={};
for(const [id,b,c,r,t,s,k] of N){const d=document.createElement('div');const ov=k&&k!=='dec';d.className='n'+(ov?' ov k-'+k:'')+(k==='dec'?' dec':'');d.dataset.id=id;
 const x=X(c),y=Y(b,r);d.style.left=x+'px';d.style.top=y+'px';d.innerHTML=(ov?'<span class="tg">'+TAGS[k]+'</span>':'')+'<b>'+t+'</b>'+(s?'<small>'+s+'</small>':'');canvas.appendChild(d);EL[id]=d;POS[id]=[x,y];}
svg.setAttribute('width',1660);svg.setAttribute('height',1080);
const PATHS={};
function edges(){svg.innerHTML='';for(const [a,b] of E){const A=EL[a],B=EL[b];if(!A||!B)continue;
 const ax=A.offsetLeft+A.offsetWidth,ay=A.offsetTop+A.offsetHeight/2,bx=B.offsetLeft,by=B.offsetTop+B.offsetHeight/2;let d;
 if(bx>ax+4) d=`M${ax} ${ay} C${ax+30} ${ay} ${bx-30} ${by} ${bx} ${by}`;
 else {const sx=A.offsetLeft+A.offsetWidth/2,sy=A.offsetTop+A.offsetHeight,tx=B.offsetLeft+B.offsetWidth/2,ty=B.offsetTop;
  d=ty>sy?`M${sx} ${sy} C${sx} ${sy+40} ${tx} ${ty-40} ${tx} ${ty}`:`M${sx} ${A.offsetTop} C${sx} ${A.offsetTop-40} ${tx} ${B.offsetTop+B.offsetHeight+40} ${tx} ${B.offsetTop+B.offsetHeight}`;}
 const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);const ba=N.find(n=>n[0]===a)[1],bb=N.find(n=>n[0]===b)[1];if(ba!==bb)p.classList.add('x');p.dataset.a=a;p.dataset.b=b;svg.appendChild(p);PATHS[a+'>'+b]=p;}}
edges();
function fit(){const w=document.getElementById('wrap');const s=Math.min(1,(w.clientWidth-16)/1660);canvas.style.transform=`scale(${s})`;canvas.style.height=(1080*s)+'px';}
addEventListener('resize',()=>{fit();phoneFit();new ResizeObserver(fit).observe(document.getElementById('wrap'));setTimeout(fit,300);});
function phoneFit(){const r=document.querySelector('.right'),ph=document.getElementById('phone');const s=Math.min(1,(innerHeight-180)/864);ph.style.transform=`scale(${s})`;ph.style.marginBottom=(-(1-s)*864)+'px';}
fit();phoneFit();document.getElementById('bFit').onclick=fit;
/* ---------- read the phone ---------- */
const frame=document.getElementById('app');
const W=()=>frame.contentWindow,D=()=>frame.contentDocument;
function state(){const d=D();if(!d||!d.body)return null;const q=s=>d.querySelector(s);const out={scr:null,ov:[]};
 const act=q('.screen.active');let s=act?act.id:null;const hash=(W().location.hash||'').slice(1);
 const MAP={name:'n2name',mobile:'n2mobile',otp:'n2otp',splash:'cine',intro:'cine',usage:'aiu'};
 if(s==='home'){const ai=q('#ai');const rsOn=hash==='research'||(q('#home .track')&&/-/.test(getComputedStyle(q('#home .track')).transform.split(',')[4]||''));
  if(rsOn){const r=q('#research');const v=(q('#research .rv.on')||{}).dataset;const dv=v?v.v:'dash-open';
   if(q('#bDet.on'))s='bdet';else if(r&&r.classList.contains('unsub')&&dv==='dash-open')s='locked';else s=({'dash-open':'dash','dash-exited':'exited','swing-open':'swing','swing-exited':'swing','mb-open':'swing','mb-exited':'swing',baskets:'baskets',pms:'pms'})[dv]||'research';}
  else{const av=ai.dataset.av;if(ai.classList.contains('sp'))s='sp';else if(av==='skills')s='skills';else if(av==='watch')s='watch';else if(av==='port')s='port';else if(ai.classList.contains('chatting'))s='chat';else s='ai';}}
 s=MAP[s]||s;if(q('#panel.on'))s='panel';out.scr=s;
 if(q('#wsm.on'))out.ov.push(['wsm','popup','Waya Score']);
 const sh=q('.sheet3.on, #wxSheet.on, #wxDemo.on');if(sh){const id=sh.id,k=sh.dataset.kind;
  if(id==='wxSheet'){if(k==='topup')out.ov.push(['sh-topup','sheet','Top-ups']);else if(k==='upgraded')out.ov.push(['ov-upgraded','sheet','Your plan now includes WayaX AI']);else if(['pro','daily','ended','lapsed'].includes(k))out.ov.push([s==='xpl'?'sh-buy':'sh-daily','sheet',(sh.querySelector('h3')||{}).textContent||'Subscribe']);else out.ov.push(['ov-sheet','sheet',k||'Sheet']);}
  else if(id==='chatSheet'||id==='renSheet')out.ov.push(['sh-chat','sheet','Chat menu']);else if(id==='holdSheet')out.ov.push(['sh-hold','sheet','New holding']);else if(id!=='wxDemo')out.ov.push(['ov-sheet','sheet',id.replace('Sheet','')]);}
 const t1=q('#wxToast.on');if(t1){const t=t1.innerText.replace('✕','').trim();let id='ov-other';
  if(/Welcome · you get/.test(t))id='ov-welcome';else if(/used today|last free question/.test(t))id='ov-limit';else if(/free questions today/.test(t))id='ov-nextday';else if(/free questions are over/.test(t))id='ov-ended';else if(/top-up added/i.test(t))id='ov-topadd';else if(/Believer|Welcome back/.test(t))id='ov-believer';else if(/Pro plan has ended/.test(t))id='ov-lapsed';
  out.ov.push([id,'toast',t]);}
 const t2=q('#toast.on, .toast.on');if(t2&&t2.id!=='wxToast'){const t=t2.innerText.trim();let id='ov-other';if(/^Chat /.test(t))id='ov-chat';else if(/Profile saved/.test(t))id='ov-saved';else if(/logged out/.test(t))id='ov-logout';out.ov.push([id,'toast',t]);}
 const bn=q('#wxBn.on');if(bn){const t=bn.innerText.replace('✕','').replace(/\s+/g,' ').trim();const lt=bn.classList.contains('lt');let id=lt?'ov-1left':/Weekly limit/.test(t)?'ov-week':/are over/.test(t)?'ov-ended':'ov-limit';out.ov.push([id,lt?'blt':'bdk',t]);}
 if(q('#wxPush.on'))out.ov.push(['push','push','Your weekly AI usage is reset']);
 try{const p=W().WXPLAN&&W().WXPLAN.state;if(p)out.plan=p.plan==='trial'?'Free access · '+p.pct+'% today':p.plan==='ended'?'Free · cycle over':['quarterly','yearly','combo'].includes(p.plan)?'Pro '+p.plan+' · '+p.pct+'% this week':p.plan;}catch(e){}
 return out;}
let last='',prev=null;const TR=[];const seen=new Set();
function paint(){let st;try{st=state();}catch(e){return;}if(!st)return;const key=JSON.stringify(st);if(key===last)return;last=key;
 Object.values(EL).forEach(e=>e.classList.remove('on','lit'));Object.values(PATHS).forEach(p=>p.classList.remove('hot','near'));
 if(st.scr&&EL[st.scr]){EL[st.scr].classList.add('on','seen');seen.add(st.scr);if(prev&&prev!==st.scr&&PATHS[prev+'>'+st.scr])PATHS[prev+'>'+st.scr].classList.add('hot');if(st.scr!==prev){focusNode(EL[st.scr]);prev=st.scr;}}
 st.ov.forEach(([id])=>{if(EL[id]){EL[id].classList.add('lit','seen');}});const act=[st.scr,...st.ov.map(o=>o[0])];Object.values(PATHS).forEach(p=>{if(act.includes(p.dataset.a)||act.includes(p.dataset.b))p.classList.add('near');});
 if(st.scr&&EL[st.scr]){const nm2=EL[st.scr].querySelector('b').textContent;if(TR[TR.length-1]!==nm2){TR.push(nm2);if(TR.length>8)TR.shift();}}st.ov.forEach(o=>{const t=EL[o[0]]?EL[o[0]].querySelector('b').textContent:o[1];if(TR[TR.length-1]!==t){TR.push(t);if(TR.length>8)TR.shift();}});document.getElementById('trail').innerHTML='<b style="color:var(--ink)">Path</b><em>·</em>'+TR.map(t=>'<span>'+t+'</span>').join('<em>→</em>');
 const now=document.getElementById('now');const nm=st.scr&&EL[st.scr]?EL[st.scr].querySelector('b').textContent:(st.scr||'—');
 now.innerHTML='<span>Now</span><span class="chip scr">'+nm+'</span>'+st.ov.map(o=>'<span class="chip '+o[1]+'" title="'+o[2].replace(/"/g,'')+'">'+o[1].replace('blt','banner').replace('bdk','banner').toUpperCase()+' · '+o[2].replace(/</g,'')+'</span>').join('')+(st.plan?'<span class="chip plan">'+st.plan+'</span>':'');}
function focusNode(el){const w=document.getElementById('wrap');const s=parseFloat((canvas.style.transform.match(/scale\(([\d.]+)/)||[0,1])[1]);const y=el.offsetTop*s;if(y<w.scrollTop+40||y>w.scrollTop+w.clientHeight-80)w.scrollTo({top:Math.max(0,y-120),behavior:'smooth'});}
setInterval(paint,250);
/* ---------- jump from the map ---------- */
const GO={cine:'cine',start:'start',pick:'pick',n2name:'n2name',n2email:'n2email',n2mobile:'n2mobile',n2otp:'n2otp',n2age:'n2age',n2city:'n2city',n3gmail:'n3gmail',li:'li',s2mobile:'s2mobile',s2otp:'s2otp',ai:'ai',chat:'ai',skills:'ai',sp:'ai',watch:'ai',port:'ai',research:'research',dash:'research',locked:'research',chats:'chats',profile:'profile',apps:'apps',about:'about',faqs:'faqs',privacy:'privacy',terms:'terms',notifs:'notifs',plan:'plan',aiu:'aiu',xpl:'xpl'};
canvas.addEventListener('click',e=>{const n=e.target.closest('.n');if(!n)return;const gid=n.dataset.id;if(gid&&gid.startsWith('g-')){try{const A=W().WXA,Gu=W().WXGUEST;A.closeSheets();Gu.enter();const k={'g-ask':'ask','g-calls':'calls','g-chats':'chats','g-watch':'watch','g-port':'port'}[gid];if(k)setTimeout(()=>Gu.sheet(k),900);if(gid==='g-menu')setTimeout(()=>A.openPanel(),900);const rt={'g-rs':[0,'dash'],'g-rtaps':[2,'swing'],'g-rdash':[5,'dash'],'g-rgate':[5,'swing']}[gid];if(rt)setTimeout(()=>{A.go('research');Gu.nav(0);const b=D().querySelector('#rsNav [data-tab='+rt[1]+']');b&&b.click();setTimeout(()=>Gu.nav(rt[0]),50);},700);if(gid==='g-rsign')setTimeout(()=>{A.go('research');Gu.nav(5);const b=D().querySelector('#rsNav [data-tab=swing]');b&&b.click();},700);}catch(err){}return;}const g=GO[n.dataset.id];if(!g)return;try{const A=W().WXA;A.closeSheets&&A.closeSheets();const pn=D().getElementById('panel');pn&&pn.classList.remove('on');A.go(g);if(['aiu','plan','xpl'].includes(g)&&W().WXPLAN)W().WXPLAN.refresh();}catch(err){}});
/* ---------- controls ---------- */
const PRE=[['trial','Free · day 1, nothing used'],['trial80','Free · 2 of 3 used'],['trial100','Free · today’s 3 used'],['trialEnded','Free · cycle over'],['quarterly','Migrated · Quarterly'],['yearly','Pro · Yearly'],['yearlyLimit','Pro · weekly limit hit'],['yearlyTopup','Pro · top-up in use'],['combo','Combo plan'],['lapsed','Lapsed'],['none','No plan']];
const sel=document.getElementById('bPlan');PRE.forEach(([k,l])=>{const o=document.createElement('option');o.value=k;o.textContent=l;sel.appendChild(o);});
sel.onchange=()=>{if(!sel.value)return;try{W().WXPLAN.set(sel.value);W().WXA.go('ai');}catch(e){}sel.value='';};
const demo=k=>{try{const b=D().querySelector('#wxDemo [data-st="'+k+'"]');b&&b.click();}catch(e){}};
document.getElementById('bNext').onclick=()=>demo('nextday');
document.getElementById('bPush').onclick=()=>demo('push');
document.getElementById('bPick').onclick=()=>{seen.clear();TR.length=0;Object.values(EL).forEach(e=>e.classList.remove('seen'));try{W().WXA.closeSheets();W().WXA.go('pick');}catch(e){}};
