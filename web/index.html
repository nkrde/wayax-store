<style>

#pnl .tut{width:100%;max-width:100%;background:#fff;border:.726px solid rgba(107,182,243,.4);border-radius:10.16px;box-shadow:0 .726px 2.177px rgba(0,0,0,.04);overflow:hidden}
#pnl .tut-hd{padding:5.806px 8.709px 4.354px;border-bottom:.726px solid #dceefd;background:linear-gradient(90deg,rgba(220,238,253,.9) 0%,#f8fafc 60%,rgba(237,245,252,.8) 80%,rgba(220,238,253,.6) 100%)}

#pnl .tut-pause i::after{left:4.35px}
#pnl .tut.paused .tut-pause i::before{width:0;height:0;border-radius:0;background:none;border-left:6px solid #64748b;border-top:3.6px solid transparent;border-bottom:3.6px solid transparent}

#pnl .tut-steps button.on{background:rgba(220,238,253,.5);border-color:#6bb6f3;color:#1b76c8;font-weight:700}

#pnl .tut-bd.anim>*{animation:tutIn .45s var(--ease) both}
#pnl .tut-bd.anim>*:nth-child(2){animation-delay:.06s}#pnl .tut-bd.anim>*:nth-child(3){animation-delay:.12s}

#pnl .tut-t{display:flex;align-items:center;justify-content:space-between;font:600 7.983px/11.975px Inter,sans-serif;color:#0f3154}
#pnl .tut-t em{font:700 7.257px/10.886px Inter,sans-serif;font-style:normal;color:#059669}

@keyframes caret{50%{opacity:0}}
#pnl .tut-in i{width:26.126px;height:26.126px;border-radius:999px;background:#6bb6f3;display:flex;align-items:center;justify-content:center;flex:none}
#pnl .tut-in i img{width:11.612px;height:11.612px}
#pnl .tut-p{font:400 7.62px/11.43px Inter,sans-serif;color:#64748b}

#pnl .tut-prog i{display:block;height:100%;width:0;background:#6bb6f3}
#pnl .tut-mini{display:flex;flex-direction:column;gap:5.65px;padding:9.888px 11.3px;border-radius:10px;background:#1c1c1e;border:.706px solid rgba(136,19,55,.4);filter:drop-shadow(0 .706px 1.059px rgba(0,0,0,.2))}

.ask textarea::placeholder{color:#94a3b8}
.qual{display:none;height:30px;border-radius:9999px;background:#fff;border:1px solid rgba(226,232,240,.9);padding:0 8px 0 10px;align-items:center;gap:4px;font:600 12px/12px Sora;color:#334155;position:relative}
.focus .qual{display:flex}
.qmenu{display:none;position:absolute;bottom:38px;right:0;background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.08);padding:6px;min-width:120px;z-index:3}
.qmenu.show{display:block}.qmenu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font:500 13px Inter}.qmenu button:hover{background:#f1f5f9}
.send{width:44px;height:44px;min-width:44px;border-radius:14px;background:var(--brand);position:relative;overflow:hidden;display:grid;place-items:center;box-shadow:0 4px 18px rgba(160,123,240,.45),0 2px 8px rgba(61,132,246,.3),inset 0 1.5px 1.5px rgba(255,255,255,.65),inset 0 -1px 2px rgba(0,0,0,.2)}
.send:before{content:"";position:absolute;left:0;top:0;right:0;height:22px;border-radius:14px 14px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.05) 80%,rgba(255,255,255,0))}
.send img{position:relative;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.legal{display:flex;align-items:center;justify-content:center;gap:10px;padding-top:16px;height:32px;white-space:nowrap}
.legal i{width:6px;height:6px;border-radius:50%;background:#10b981}
.legal b{font:700 10px/15px Inter;letter-spacing:.5px;color:#334155;text-transform:uppercase}
.legal span{font:400 10.5px/15.75px Inter;color:#94a3b8}.legal .sep{color:#cbd5e1}.legal .dis{color:#64748b}
.chips{display:flex;gap:16px;padding-top:32px;height:72px}
.chip{width:188px;height:40px;border-radius:12px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;border:1px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(#fff,#fff) border-box;box-shadow:0 1px 3px rgba(0,0,0,.04),0 1px 6px rgba(136,91,232,.06);position:relative}
.focusmode .chip{border-color:#d946ef;background:linear-gradient(#fff,#fff) padding-box,var(--edge) border-box}
.chip .l{display:flex;align-items:center;gap:10px;font:500 13px/19.5px Inter;color:#334155}
.chip .ic{width:24px;height:24px;border-radius:8px;background:#f1f5f9;display:grid;place-items:center}
.chip:hover{border-color:#c4b5fd}
.saved{display:none;position:absolute;top:46px;left:0;right:0;background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.08);padding:6px;z-index:3;text-align:left}
.saved.show{display:block}.saved button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font:400 12.5px Inter;color:#334155}.saved button:hover{background:#f1f5f9}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,80px);background:#1c1c1e;color:#fff;padding:10px 18px;border-radius:999px;font:500 13px Inter;transition:.25s;z-index:9}.toast.s{transform:translate(-50%,0)}
@media(max-width:1000px){.legal .dis,.legal .sep{display:none}.chips{flex-wrap:wrap;height:auto;justify-content:center}}
@media(max-width:1000px){.shell.panel,.shell.open.panel{grid-template-columns:72px 0 1fr}.pnl{position:fixed;left:92px;top:8px;bottom:8px;width:min(480px,calc(100vw - 104px));z-index:40;margin:0}}
.shell>.side{grid-column:1}.shell>.pnl{grid-column:2}.shell>.main{grid-column:3}
@media(max-width:1100px){h1{display:block;text-align:center;font-size:30px;line-height:38px}}
</style></head><body>

  <div class="skillsw"><button class="skillsb dark" id="skillsBtn"><span class="row" style="gap:10px"><img src="fx/skills.svg" width="18" height="18" alt=""><span class="t wide">Skills</span></span><img class="wide" src="fx/chev-right-skills.svg" width="14" height="14" alt=""></button></div>

  <div class="prod">
    <h6>Waya Company Research Products</h6>
    <nav>
      <button class="nv" data-toast="Waya Swing Trade"><img src="fx/trending-up.svg" width="17" height="17" alt=""><span class="t">Waya Swing Trade</span><img class="ch" src="fx/chev-right-nav.svg" width="14" height="14" alt=""></button>
      <button class="nv" data-toast="Waya MultiBagger"><img src="fx/target.svg" width="17" height="17" alt=""><span class="t">Waya MultiBagger</span><img class="ch" src="fx/chev-right-nav.svg" width="14" height="14" alt=""></button>
      <button class="nv" data-toast="Waya Baskets"><img src="fx/baskets.svg" width="16" height="16" alt=""><span class="t">Waya Baskets</span><img class="ch" src="fx/chev-right-nav.svg" width="14" height="14" alt=""></button>
      <button class="nv" data-toast="Waya PMS"><img src="fx/pms.svg" width="16" height="16" alt=""><span class="t">Waya PMS</span><img class="ch" src="fx/chev-right-nav.svg" width="14" height="14" alt=""></button>
    </nav>
  </div>

  <div class="spacer"></div>
  <div class="quota">
    <div class="qmini" title="18 questions left this month">18<i></i></div>
    <div class="qfull"><div class="r"><span>Questions left this month</span><b id="qLeft">18</b></div><div class="track"><i id="qBar" style="width:72%"></i></div><small>of 25 included questions</small></div>
  </div>
  <div class="me"><button class="meb" data-toast="Profile"><span class="ava" id="ava">R</span><span class="mi"><b id="uName">Rahul</b><small>SEBI-compliant AI research</small></span><span class="active">Active</span><img class="ch" src="fx/chev-right-nav.svg" width="14" height="14" alt=""></button></div>
</aside>
<section class="pnl" id="pnl" aria-label="WayaX Skills">
  <div class="ph"><h2>Waya<b>X</b> Skills</h2><button class="px" id="pnlClose" aria-label="Close skills">✕</button></div>
  <div class="howw"><div class="how open" data-how="skills"><button class="how-pill" aria-expanded="true"><span class="how-ic"><i></i><i></i></span><b>How it works?</b></button><i class="how-rail"></i><div class="how-body"><div class="how-in"></div></div></div></div>

<main class="main focusmode" id="main">
  <button class="openbtn" id="openBtn" aria-label="Open sidebar"><img src="fx/panel-left-open.svg" width="17" height="17" alt=""></button>

      <div class="qmenu" id="qmenu"><button data-q="Fast">Fast</button><button data-q="Balanced">Balanced</button><button data-q="High">High</button></div></div>

    <button class="chip" data-toast="WayaX Research"><span class="l"><span class="ic"><img src="fx/sparkles.svg" width="14" height="14" alt=""></span>WayaX Research</span><img src="fx/chev-right-chip.svg" width="14" height="14" alt=""></button>
    <div class="chip" id="savedChip" role="button" tabindex="0"><span class="l"><span class="ic"><img src="fx/bookmark.svg" width="14" height="14" alt=""></span>Saved Prompts</span><img src="fx/chev-down-chip.svg" width="13" height="13" alt="">
      <div class="saved" id="saved"><button>Give me 2 Small Cap multibagger picks inside the Nifty Smallcap 250</button><button>Best entry zone for ICICI Bank this week</button><button>Analyse my portfolio for concentration risk</button></div></div>

  <button class="replay" data-toast="Replaying intro" aria-label="Replay intro"><img src="fx/play.svg" width="11" height="11" alt=""></button>
</main>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),shell=$('#shell');
const NAME='Rahul';$('#hi').textContent='X, '+NAME;$('#uName').textContent=NAME;$('#ava').textContent=NAME[0];
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('s');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('s'),1600)};
const setOpen=o=>{shell.classList.toggle('open',o);try{localStorage.setItem('wxSide',o?'1':'0')}catch(e){}};
try{if(localStorage.getItem('wxSide')==='1')shell.classList.add('open')}catch(e){}
document.querySelector('.side').addEventListener('mouseenter',()=>{if(!shell.classList.contains('open')&&!(shell.classList.contains('panel')&&innerWidth<1280))setOpen(true)});
$('#logoBtn').onclick=()=>{if(!shell.classList.contains('open')&&!(shell.classList.contains('panel')&&innerWidth<1280))setOpen(true)};$('#openBtn').onclick=()=>setOpen(true);$('#collapseBtn').onclick=()=>setOpen(false);
document.querySelectorAll('.nv').forEach(b=>b.addEventListener('click',()=>{if(b.closest('.prod'))return;document.querySelectorAll('nav:not(.prod nav) .nv').forEach(x=>x.classList.remove('on'));b.classList.add('on')}));
document.addEventListener('click',e=>{const t=e.target.closest('[data-toast]');if(t)toast(t.dataset.toast)});
const ask=$('#ask'),q=$('#q'),main=$('#main');
const focusOn=v=>{ask.classList.toggle('focus',v);main.classList.toggle('focusmode',v)};
q.addEventListener('focus',()=>focusOn(true));

q.addEventListener('input',()=>{q.style.height='22px';q.style.height=Math.min(q.scrollHeight,180)+'px'});
$('#qual').onclick=()=>$('#qmenu').classList.toggle('show');$('#qmenu').onclick=e=>{const b=e.target.closest('[data-q]');if(b){$('#qv').textContent=b.dataset.q;$('#qmenu').classList.remove('show')}};
const send=()=>{const v=q.value.trim();if(!v){q.focus();return}let n=+$('#qLeft').textContent;if(n>0){n--;$('#qLeft').textContent=n;document.querySelector('.qmini').firstChild.nodeValue=n;$('#qBar').style.width=(n/25*100)+'%'}toast('Sent: '+(v.length>48?v.slice(0,48)+'…':v));q.value='';q.style.height='22px'};
$('#send').onclick=send;q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('#savedChip').onclick=e=>{const b=e.target.closest('#saved button');if(b){q.value=b.textContent;focusOn(true);q.focus();$('#saved').classList.remove('show');return}$('#saved').classList.toggle('show')};

const SK=[["Stock Recommendation","Which Mid Cap logistics company should I buy right now?"],["Stock Fundamentals","Show me the fundamentals of TATA MOTORS: revenue growth, margins, debt and valuation."],["Stock Technicals","What are the support, resistance and trend for TATA STEEL?"],["General Stock Information","Tell me about TATA POWER: business, management and recent news."],["Mutual Funds","Compare the top 3 Small Cap mutual funds by 3-year returns."],["Portfolio Analysis","Analyse my portfolio for concentration risk and rebalancing."],["Screener","Screen Mid Cap stocks with ROE above 18% and debt to equity below 0.5."],["Financial Modelling","Build a 5-year DCF model for INFY from my Excel workbook."]];
$('#skList').innerHTML=SK.map(([t],i)=>`<button data-sk="${i}">${t}<img src="fx/chev-right-chip.svg" width="14" height="14" alt=""></button>`).join('');
const openPanel=o=>{shell.classList.toggle('panel',o);if(o&&innerWidth<1280)setOpen(false);o?startTut('skills'):stopTut('skills',true);$('#exploreChip').classList.toggle('dk',o);$('#skillsBtn').classList.toggle('on',o)};
$('#skillsBtn').onclick=()=>openPanel(!shell.classList.contains('panel'));$('#exploreChip').onclick=()=>openPanel(!shell.classList.contains('panel'));$('#pnlClose').onclick=()=>openPanel(false);
$('#skList').onclick=e=>{const b=e.target.closest('[data-sk]');if(!b)return;q.value=SK[+b.dataset.sk][1];q.dispatchEvent(new Event('input'));q.focus();q.setSelectionRange(q.value.length,q.value.length)};

const TUT={skills:{label:'Skill Tutorial',steps:['1. Select Skill','2. Auto-Insert','3. Edit Text'],body:[
()=>`<p class="tut-t">Step 1: Open a Skill<em>Tap +</em></p><div class="tut-list"><span>Stock Recommendation<b>+</b></span><span class="hi">Stock Fundamentals<b>−</b></span><span>Stock Technicals<b>+</b></span></div><p class="tut-p">Every skill comes with ready-made prompt questions.</p>`,
()=>`<p class="tut-t">Step 2: Prompt Loaded in Search Bar<em>✓ Auto-Inserted</em></p><div class="tut-in"><span>Review quarterly results of <b>TATASTEEL</b></span><i><img src="../assets/v2/tut-send.svg" alt=""></i></div><p class="tut-p">The full prompt template is automatically placed into the chat search bar.</p>`,
()=>`<p class="tut-t">Step 3: Edit &amp; Send<em>✎ Editable</em></p><div class="tut-in"><span>Review quarterly results of <b>INFY</b><i class="caret"></i></span><i><img src="../assets/v2/tut-send.svg" alt=""></i></div><p class="tut-p">Change the stock or any words, then tap send.</p>`]}};
const tutState={};
document.querySelectorAll('#pnl .how').forEach(h=>{const k=h.dataset.how,T=TUT[k];
 h.querySelector('.how-in').innerHTML=`<div><div class="tut"><div class="tut-hd"><div class="tut-r1"><span class="tut-lb">${T.label}</span><button class="tut-pause"><i></i><span>Pause</span></button></div><div class="tut-steps">${T.steps.map((s,i)=>`<button data-s="${i}">${s}</button>`).join('')}</div></div><div class="tut-bd"></div><div class="tut-prog"><i></i></div></div></div>`;
 tutState[k]={step:0,paused:false,t:0,h};paintTut(k,false);
 h.querySelector('.how-pill').onclick=()=>{const o=!h.classList.contains('open');h.classList.toggle('open',o);h.querySelector('.how-pill').setAttribute('aria-expanded',o);o?startTut(k):stopTut(k)};
 h.querySelector('.tut-steps').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;tutState[k].step=+b.dataset.s;paintTut(k,true);startTut(k)};
 h.querySelector('.tut-pause').onclick=()=>{const st=tutState[k];st.paused=!st.paused;h.querySelector('.tut').classList.toggle('paused',st.paused);h.querySelector('.tut-pause span').textContent=st.paused?'Play':'Pause';st.paused?stopTut(k,true):startTut(k)};});
function paintTut(k,anim){const st=tutState[k],h=st.h;h.querySelectorAll('.tut-steps button').forEach((b,i)=>b.classList.toggle('on',i===st.step));const bd=h.querySelector('.tut-bd');bd.innerHTML=TUT[k].body[st.step]();bd.classList.remove('anim');if(anim){void bd.offsetWidth;bd.classList.add('anim')}}
function startTut(k){const st=tutState[k];clearInterval(st.t);if(st.paused||!st.h.classList.contains('open')||!shell.classList.contains('panel'))return;const bar=st.h.querySelector('.tut-prog i'),D=3200;let t0=performance.now();st.t=setInterval(()=>{const p=Math.min(1,(performance.now()-t0)/D);bar.style.width=p*100+'%';if(p>=1){st.step=(st.step+1)%TUT[k].steps.length;paintTut(k,true);t0=performance.now()}},50)}
function stopTut(k,keep){const st=tutState[k];clearInterval(st.t);if(!keep)st.h.querySelector('.tut-prog i').style.width='0%'}

</script></body></html>
