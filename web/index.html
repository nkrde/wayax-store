<style>

:root{--ink:#171829;--mut:#5f6680;--soft:#9299ae;--line:#e3e6ef;--bg:#f9f9f9;--card:#fff;--dark:#1c1c1e;--pur:#a05ec8;--pur2:#7b479b;--teal:#19b7ac;--green:#059669;--red:#e5484d;--grad:linear-gradient(90deg,#77f2e4,#c172f1 58%,#edb168 96%)}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}input{font:inherit}

.app{display:grid;grid-template-columns:260px 1fr;height:100vh}

.newc:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.sec{font-size:11px;letter-spacing:.08em;color:#8a8d9a;text-transform:uppercase;margin:14px 10px 4px}

.plan .row{display:flex;align-items:center;gap:10px}.ring{--p:40;width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--pur) calc(var(--p)*1%),#ecd3fd 0);display:grid;place-items:center}.ring span{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;font:700 9px Sora}

.sugg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;text-align:left}.sugg button{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left}.sugg button b{display:block;margin-bottom:3px}.sugg button span{color:var(--mut);font-size:13px}.sugg button:hover{border-color:#c4a6e8}

.typing span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--mut);animation:b 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:.25;transform:translateY(-3px)}}

.cbox input{flex:1;border:0;outline:0;font-size:15px}.eff{border:1px solid #e2e8f0;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:#64748b}
.send{width:40px;height:40px;border-radius:50%;background:linear-gradient(90deg,#20ddcf,#21d2bd 36%,#2bb6c5 73%,#3990d1);display:grid;place-items:center;box-shadow:0 2px 10px rgba(61,132,246,.3)}.send img{width:18px;filter:brightness(10)}

.met{background:#f0dcfc;border-radius:22px;padding:8px 22px}.met .r{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid #fff}.met .r:last-child{border:0}.met b{font:600 20px Inter;color:#4c0d70}

.dhead{background:#1b1b1d;color:#fff;border-radius:24px;padding:26px 30px;margin-bottom:20px}

.bigring{--p:40;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--pur) calc(var(--p)*1%),#ecd3fd 0);display:grid;place-items:center}.bigring>div{width:96px;height:96px;border-radius:50%;background:#fbf7ff;display:grid;place-items:center;text-align:center}.bigring b{font:700 24px Sora;display:block}.bigring small{font-size:9px;color:var(--pur2);font-weight:600;letter-spacing:.08em}
.tu{border:1px solid #d9ddec;border-radius:14px;padding:16px;text-align:center;background:#fff;position:relative}.tu.on{border:2px solid var(--teal)}.tu .mp{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--teal);color:#fff;font-size:10px;font-weight:700;padding:2px 10px;border-radius:6px;white-space:nowrap}
.tu b{font:700 22px Sora;display:block;margin:4px 0}.tu .pc{color:#118e85;font-weight:600;font-size:12px}.sv{display:inline-block;background:#cbf5ef;color:#08645d;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;margin-top:6px}
.bar{height:8px;border-radius:4px;background:#ecd3fd;overflow:hidden}.bar i{display:block;height:100%;background:var(--pur);border-radius:4px}
.ntf{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid #f1f2f6}.ntf .ic{width:36px;height:36px;border-radius:50%;background:#dbfcf8;color:#0d7062;display:grid;place-items:center;font-weight:600;flex:none}
.drawer{position:fixed;inset:0 0 0 auto;width:400px;background:#fff;box-shadow:-20px 0 60px rgba(23,24,41,.18);transform:translateX(105%);transition:.3s;z-index:20;display:flex;flex-direction:column}.drawer.open{transform:none}.drawer header{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.drawer .b{overflow:auto;padding:4px 22px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--dark);color:#fff;padding:12px 20px;border-radius:999px;transition:.3s;z-index:30;font-size:13px}.toast.s{transform:translateX(-50%)}
.banner{max-width:780px;margin:0 auto 12px;background:#111621;color:#fff;border-radius:18px;padding:14px 18px;display:flex;align-items:center;gap:14px}.banner p{margin:0;flex:1;color:#c6cad8;font-size:13px}.banner b{color:#fff;display:block;font:600 15px Sora;margin-bottom:2px}
.demo{position:fixed;left:276px;bottom:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:12px;color:var(--mut);box-shadow:0 4px 14px rgba(0,0,0,.06);z-index:5}.demo select{border:0;font:inherit;color:var(--ink);font-weight:600;background:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.g3,.g4{grid-template-columns:1fr 1fr}.demo{left:16px}}
</style></head><body>

<script>
const $=s=>document.querySelector(s),V=$('#view');
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('s');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('s'),1800)};
const HIST=["Become a Believer Plans","Waya App Features","ICICI Bank deep dive","Stock ideas for November","My portfolio review","Nifty outlook","FAQs & Support"];
$('#histList').innerHTML=HIST.map(h=>`<button class="hist" data-q="${h}">${h}</button>`).join('');
const ST={t40:{t:"Free trial",s:"Ends on 03 Jan 2027",p:40,chip:"FREE TRIAL",reset:"Resets 26 Nov",left:"60% left this month"},t80:{t:"Free trial",s:"Ends on 03 Jan 2027",p:80,chip:"FREE TRIAL",reset:"Resets 26 Nov",left:"20% left this month",bn:"80"},t100:{t:"Free trial",s:"Ends on 03 Jan 2027",p:100,chip:"FREE TRIAL",reset:"Resets 26 Nov",left:"0% left this month",bn:"100"},q:{t:"Believer · Quarterly",s:"Renews 30 Aug 2027",p:31,chip:"BELIEVER · QUARTERLY",reset:"Resets Mon 9:00 AM",left:"69% left this week",paid:"Paid ₹4,500 on 30 Oct 2026"},y:{t:"Pro · Yearly",s:"Renews 30 Aug 2027",p:62,chip:"BELIEVER · YEARLY",reset:"Resets Mon 9:00 AM",left:"38% left this week",paid:"Paid ₹6,500 on 30 Aug 2026"},lim:{t:"Pro · Yearly",s:"Weekly limit reached",p:100,chip:"BELIEVER · YEARLY",reset:"Resets Mon 9:00 AM",left:"0% left this week",bn:"wk",paid:"Paid ₹6,500 on 30 Aug 2026"},top:{t:"Pro · Yearly",s:"Using top-up",p:74,chip:"TOP-UP IN USE",reset:"Limit back Mon 9:00 AM",left:"26% left · weekly limit + top-ups",paid:"Paid ₹6,500 on 30 Aug 2026",tu:1},none:{t:"No active plan",s:"Become a Waya Believer",p:0,chip:"NO PLAN",reset:"—",left:"Subscribe to use WayaX AI",bn:"none"}};
let S=ST.t40;try{S=ST[localStorage.getItem('wxWebState')]||S;$('#state').value=localStorage.getItem('wxWebState')||'t40'}catch(e){}
function syncPlan(){$('#pTitle').textContent=S.t;$('#pSub').textContent=S.s;$('#sRing').style.setProperty('--p',S.p);$('#sPct').textContent=S.p+'%';}
$('#state').onchange=e=>{S=ST[e.target.value];try{localStorage.setItem('wxWebState',e.target.value)}catch(_){};syncPlan();route()};
/* ---------- views ---------- */
const BANNER=()=>S.bn==='80'?`<div class="banner" style="background:#fff;color:var(--ink);border:1px solid #d6cbfb"><p style="color:var(--mut)"><b style="color:var(--ink)">80% of this month's free allowance used</b>Resets 26 Nov</p><button class="btn" style="color:#5a3cc7" data-go="xpl">See Pro Plans</button></div>`:S.bn==='100'?`<div class="banner"><p><b>You've used this month's free allowance.</b>Resets 26 Nov. Calls, Watch To Buy and history still work.</p><button class="btn" style="background:#fff;color:var(--ink)" data-go="xpl">Get Pro</button></div>`:S.bn==='wk'?`<div class="banner"><p><b>Weekly limit reached.</b>Resets Mon 9:00 AM.</p><button class="btn" style="background:#fff;color:var(--ink)" data-go="plan">Buy top-ups</button></div>`:S.bn==='none'?`<div class="banner"><p><b>Become a Waya Believer</b>Stock Recommendations + WayaX AI</p><button class="btn" style="background:#fff;color:var(--ink)" data-go="xpl">Subscribe</button></div>`:'';

 renderMsgs();const go=()=>{const v=$('#ask').value.trim();if(!v)return;$('#ask').value='';ask(v)};$('#send').onclick=go;$('#ask').onkeydown=e=>{if(e.key==='Enter')go()};
 const L=['Low','Medium','High'];let i=1;$('#eff').onclick=()=>{i=(i+1)%3;$('#eff').textContent=L[i]+' ▾';toast('Thinking effort: '+L[i])};}
function renderMsgs(){const el=$('#inner');if(!el)return;if(!chat.length){el.innerHTML=`<div class="hero"><img src="../assets/ai/logo.svg"><h2>Hey Rahul</h2><p>Welcome to Waya<b style="background:linear-gradient(90deg,#7065fb,#df59b4);-webkit-background-clip:text;color:transparent">X</b> AI</p><div class="sugg">${[["Which stock should I buy today?","Today’s top research pick"],["ICICI Bank deep dive","Fundamentals, technicals, Waya Score"],["Review my portfolio","Risk, concentration and rebalancing"],["Nifty outlook this week","Levels to watch and sector rotation"]].map(([a,b])=>`<button data-ask="${a}"><b>${a}</b><span>${b}</span></button>`).join('')}</div></div>`;return}
